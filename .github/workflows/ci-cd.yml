name: CI/CD - Build and Publish AIWAF Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (tagged for local smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: aiwaf:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - container boots and responds
        run: |
          docker run -d --name aiwaf-test -p 5000:5000 aiwaf:ci-test
          echo "Waiting for models to load..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ -o /dev/null; then
              echo "App is up."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5000/ -o /dev/null || (docker logs aiwaf-test && exit 1)
          docker stop aiwaf-test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
