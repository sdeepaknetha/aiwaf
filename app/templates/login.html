<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Login - Protected by AI-WAF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent-primary: #8b5cf6;
            --accent-attack: #f43f5e;
            --accent-safe: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 20px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #8b5cf6, #6366f1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            filter: brightness(1.1);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .malicious {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid var(--accent-attack);
            color: var(--accent-attack);
        }

        .back-link {
            margin-top: 24px;
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>LOGIN PROTECTED</h1>
        <p style="color: var(--text-dim); margin-bottom: 30px; font-size: 0.95rem;">Enter credentials to access the
            secure area.</p>

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username / Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Unlock System</button>
        </form>

        {% if message %}
        <div class="message malicious">
            {{ message }}
        </div>
        {% endif %}

        <a href="/" class="back-link">← Back to Dashboard</a>
    </div>
</body>

</html>
